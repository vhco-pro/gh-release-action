name: Test

on:
  workflow_call:

permissions: {}

defaults:
  run:
    shell: bash

jobs:
  scripts:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Lint workflows
        uses: docker://rhysd/actionlint:1.7.12@sha256:b1934ee5f1c509618f2508e6eb47ee0d3520686341fec936f3b79331f9315667
        with:
          args: -color
      - name: Check shell scripts
        uses: docker://koalaman/shellcheck:v0.11.0@sha256:61862eba1fcf09a484ebcc6feea46f1782532571a34ed51fedf90dd25f925a8d
        with:
          args: scripts/install-git-cliff.sh scripts/publish-release.sh scripts/render-notes.sh scripts/select-range.sh tests/mock-gh.sh tests/test-release.sh
      - name: Run the release script tests
        run: bash tests/test-release.sh
