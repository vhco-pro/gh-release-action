name: Test

on:
  workflow_call:

permissions: {}

jobs:
  scripts:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - run: shellcheck scripts/*.sh tests/*.sh
      - run: bash tests/test-release.sh
